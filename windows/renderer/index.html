<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Website Tester</title>
  <style>
    body{font:15px Segoe UI,Arial;margin:32px;max-width:820px;color:#202124}
    h1{margin-bottom:24px}
    label{display:block;font-weight:600;margin-top:14px}
    input{width:100%;padding:10px;margin:6px 0 8px;box-sizing:border-box}
    .hint{font-size:12px;color:#666;margin-bottom:14px}
    button{padding:10px 18px;margin:16px 8px 0 0;cursor:pointer}
    #progress,#status{margin-top:20px;white-space:pre-wrap;padding:14px;background:#f5f5f5;border-radius:6px}
    .pass{color:#16803c}.fail{color:#b42318}.muted{color:#666}
  </style>
</head>
<body>
  <h1>Website Tester</h1>
  <label for="url">Homepage URL</label>
  <input id="url" placeholder="https://example.com">
  <label for="cookieName">Cookie name</label>
  <input id="cookieName" placeholder="Optional">
  <label for="cookieValue">Cookie value</label>
  <input id="cookieValue" placeholder="Optional">
  <div class="hint">If both fields are filled in, the cookie is set before the homepage loads.</div>
  <button id="save">Save settings</button>
  <button id="run">Run homepage test</button>
  <button id="openFolder" disabled>Open screenshots folder</button>
  <div id="progress" class="muted">Ready.</div>
  <div id="status"></div>
  <script src="renderer.js"></script>
</body>
</html>
