<!doctype html><html><head><meta charset="utf-8"><title>Website Tester</title><style>body{font:15px Segoe UI,Arial;margin:32px;max-width:820px}input{width:100%;padding:10px;margin:6px 0 18px;box-sizing:border-box}button{padding:10px 18px;margin-right:8px}#status,#progress{margin-top:24px;white-space:pre-wrap}.pass{color:#16803c}.fail{color:#b42318}.muted{color:#666}</style></head><body><h1>Website Tester</h1><label>Homepage URL</label><input id="url" placeholder="https://example.com"><label>Cookie name (optional)</label><input id="cookieName" placeholder="cookie_name"><label>Cookie value (optional)</label><input id="cookieValue" placeholder="cookie value"><label>Daily run time</label><input id="schedule" type="time" value="06:00"><button id="save">Save</button><button id="run">Run now</button><div id="progress" class="muted">Ready.</div><div id="status"></div><script src="renderer.js"></script></body></html>
