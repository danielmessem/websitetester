name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\windows\browsers
      WEBSITE_TESTER_BROWSER_DIR: ${{ github.workspace }}\windows\browsers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install bundled Chromium
        run: npx playwright install chromium
      - name: Smoke test homepage engine
        run: npm test
      - name: Build self-contained installer
        run: npm run build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Website-Check-Windows-Installer
          path: windows/dist/*.exe
          if-no-files-found: error
