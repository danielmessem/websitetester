name: Build Website Tester

on:
  push:
    branches: [main]
    paths:
      - 'website_tester/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/danielmessem/websitetester
  VERSION: '0.1.0'
  ARCHITECTURES: '["amd64", "aarch64"]'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            image: ghcr.io/danielmessem/websitetester/amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: ghcr.io/danielmessem/websitetester/aarch64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website_tester/Dockerfile
          push: true
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          tags: |
            ${{ matrix.image }}:${{ env.VERSION }}
            ${{ matrix.image }}:latest

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/danielmessem/websitetester:${{ env.VERSION }} \
            -t ghcr.io/danielmessem/websitetester:latest \
            ghcr.io/danielmessem/websitetester/amd64:${{ env.VERSION }} \
            ghcr.io/danielmessem/websitetester/aarch64:${{ env.VERSION }}
